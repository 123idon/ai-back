
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>백년화편 AI 자동화 센터 V3.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-dark: #0f172a; --bg-panel: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #3b82f6; --success: #10b981; }
        body { margin: 0; font-family: sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: var(--bg-panel); padding: 20px; border-right: 1px solid #334155; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background: var(--bg-panel); padding: 25px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>BH-TOOL</h2>
        <p style="color:var(--success)">● AI System Live</p>
    </div>
    <div class="main">
        <div class="card">
            <h1>AI 협업 및 자율 유지보수 센터</h1>
            <p>본 시스템은 Gemini 1.5 Pro 엔진과 연동되어 실시간 매출 분석 및 코드 자가 수정을 수행합니다.</p>
        </div>
        <div class="card">
            <h3>최신 AI 전략 리포트</h3>
            <p>"현재 '답례떡' 검색 트렌드가 상승 중입니다. B2B 프로모션 강화를 제안합니다."</p>
            <button class="btn" onclick="alert('전략 실행 파이프라인 가동!')">제안 승인 및 즉시 실행</button>
        </div>
    </div>
</body>
</html>
