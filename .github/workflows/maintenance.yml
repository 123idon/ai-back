name: BH-Tool Autonomous Maintenance (AI 자율 주행 엔진)

on:
  schedule:
    - cron: '0 3 * * *' # 매일 새벽 3시마다 스스로 기상해서 시스템 점검
  workflow_dispatch:

permissions:
  contents: write # 코드를 스스로 수정하고 덮어쓸 수 있는 권한 부여

jobs:
  ai_self_healing:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 서버 소스코드 가져오기
        uses: actions/checkout@v3

      - name: 2. 파이썬 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. AI 통신 모듈 설치
        run: pip install google-generativeai

      - name: 4. Gemini AI 두뇌 호출 및 코드 자가 수정 (핵심 로직)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # 대표님이 숨겨둔 열쇠를 여기서 꺼내 씁니다.
        run: |
          python -c "
          import os
          import google.generativeai as genai
          
          # 대표님의 열쇠로 제미나이 접속
          genai.configure(api_key=os.environ['GEMINI_API_KEY'])
          model = genai.GenerativeModel('gemini-1.5-pro')
          
          # 서버의 메인 코드를 AI가 읽어들임
          with open('main.py', 'r', encoding='utf-8') as f:
              current_code = f.read()
              
          # AI에게 시스템 최적화 지시
          prompt = f'다음 코드를 분석해서 성능을 최적화하거나 버그를 수정한 전체 코드를 다시 짜줘. 설명 없이 파이썬 코드만 출력해:\\n\\n{current_code}'
          response = model.generate_content(prompt)
          
          # AI가 짜준 새로운 코드로 기존 파일 덮어쓰기
          new_code = response.text.replace('```python', '').replace('```', '').strip()
          with open('main.py', 'w', encoding='utf-8') as f:
              f.write(new_code)
          print('✅ AI 자가 코드 수정 완료')
          "

      - name: 5. 수정된 코드를 서버에 자동 배포 (Auto-Commit)
        run: |
          git config --global user.name 'BH-Tool AI Bot'
          git config --global user.email 'ai-bot@baeknyeon.com'
          git commit -am "🤖 AI Auto-Patch: 시스템 성능 최적화 및 유지보수 완료" || echo "No changes needed"
          git push
